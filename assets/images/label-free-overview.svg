<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">LFEvent method overview</title>
  <desc id="description">A schematic redrawn from the published abstract. An MLLM enriches image–text pairs with event themes, event types and image descriptions to construct positive samples. A Siamese network learns representations through label-free contrastive learning. Structural entropy-guided clustering detects events without a predefined cluster count.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#71819d"/></marker>
  </defs>
  <rect width="1200" height="480" rx="16" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26324f">
    <g fill="none" stroke="#71819d" stroke-width="3" marker-end="url(#arrow)">
      <path d="M198 215H245"/>
      <path d="M476 215H524"/>
      <path d="M764 215H816"/>
      <path d="M116 316V402H645V326" stroke-dasharray="8 6"/>
    </g>
    <rect x="25" y="98" width="173" height="218" rx="16" fill="#f0f5fb" stroke="#c8d5e8" stroke-width="2"/>
    <text x="111" y="76" text-anchor="middle" font-size="24" font-weight="700">Social posts</text>
    <rect x="55" y="126" width="113" height="69" rx="9" fill="#fff" stroke="#91a8ce" stroke-width="2"/>
    <path d="m65 184 29-30 21 20 16-17 26 27" fill="none" stroke="#849ec5" stroke-width="3"/>
    <circle cx="142" cy="143" r="7" fill="#e7bf6b"/>
