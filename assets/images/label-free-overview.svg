    <path d="M69 228H154M69 240H147M69 252H126" stroke="#9aaecb" stroke-width="3"/>
    <text x="111" y="295" text-anchor="middle" font-size="21">Image + text</text>

    <rect x="246" y="98" width="230" height="218" rx="16" fill="#f3effc" stroke="#c4b6e5" stroke-width="2"/>
    <text x="361" y="61" text-anchor="middle" font-size="24" font-weight="700">MLLM semantic</text>
    <text x="361" y="87" text-anchor="middle" font-size="24" font-weight="700">enhancement</text>
    <g font-size="21" text-anchor="middle">
      <rect x="264" y="119" width="194" height="41" rx="8" fill="#fff"/><text x="361" y="147">Event theme</text>
      <rect x="264" y="174" width="194" height="41" rx="8" fill="#fff"/><text x="361" y="202">Event type</text>
      <rect x="264" y="229" width="194" height="41" rx="8" fill="#fff"/><text x="361" y="257">Image description</text>
      <text x="361" y="298" fill="#76639c">Positive samples</text>
    </g>

    <rect x="525" y="98" width="239" height="218" rx="16" fill="#edf6f5" stroke="#a5cdc7" stroke-width="2"/>
    <text x="644" y="61" text-anchor="middle" font-size="24" font-weight="700">Label-free</text>
    <text x="644" y="87" text-anchor="middle" font-size="24" font-weight="700">contrastive learning</text>
    <rect x="545" y="125" width="199" height="58" rx="9" fill="#fff" stroke="#84b7ae" stroke-width="2"/>
    <rect x="545" y="218" width="199" height="58" rx="9" fill="#fff" stroke="#84b7ae" stroke-width="2"/>
    <text x="644" y="162" text-anchor="middle" font-size="24">Encoder</text>
