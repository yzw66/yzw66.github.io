    <rect x="817" y="98" width="357" height="218" rx="16" fill="#fff7eb" stroke="#e8cea0" stroke-width="2"/>
    <text x="996" y="61" text-anchor="middle" font-size="24" font-weight="700">Structural entropy</text>
    <text x="996" y="87" text-anchor="middle" font-size="24" font-weight="700">guided clustering</text>
    <g fill="none" stroke-width="2">
      <ellipse cx="893" cy="180" rx="49" ry="54" stroke="#97b3dc" stroke-dasharray="6 5"/>
      <ellipse cx="1013" cy="207" rx="50" ry="54" stroke="#a59cd2" stroke-dasharray="6 5"/>
